# CoorenLabs — Fly.io config
# Deploy: fly launch (first time) or fly deploy (updates)

app = "coorenlab"
primary_region = "sin"   # Singapore — closest to India for low latency

[build]
  dockerfile = "Dockerfile"

[env]
  PORT         = "3000"
  NODE_ENV     = "production"
  CORS_ORIGIN  = "*"

[http_service]
  internal_port       = 3000
  force_https         = true
  auto_stop_machines  = "stop"    # stops when idle — saves free quota
  auto_start_machines = true      # auto-starts on request
  min_machines_running = 0        # 0 = full serverless mode on free plan

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  size   = "shared-cpu-1x"   # free tier machine
  memory = "512mb"            # enough for Chromium + Bun

[checks]
  [checks.health]
    grace_period = "10s"
    interval     = "30s"
    method       = "GET"
    path         = "/"
    port         = 3000
    timeout      = "5s"
    type         = "http"
