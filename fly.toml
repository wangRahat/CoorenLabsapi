# fly.toml app configuration file generated for coorenlabsapi on 2026-10-12T03:10:57Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'coorenlabsapi'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  CORS_ORIGIN = '*'
  NODE_ENV = 'production'
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

[checks]
  [checks.health]
    port = 3000
    type = 'http'
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
